[package]
name = "kolux-rs"
version = "0.1.0"
description = "Kolux RS: run many AI coding agents side by side"
authors = ["Txais Xiong"]
license-file = "../LICENSE"
publish = false
edition = "2021"
default-run = "kolux-rs"

[lib]
name = "kolux_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kolux-dev"
path = "src/bin/kolux-dev.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
