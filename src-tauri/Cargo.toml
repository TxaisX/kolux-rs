[package]
name = "kolux-rs"
version = "0.1.0"
description = "Kolux RS: run many AI coding agents side by side"
authors = ["Txais Xiong"]
license-file = "../LICENSE"
publish = false
edition = "2021"

[lib]
name = "kolux_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
