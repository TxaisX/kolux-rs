[package]
name = "kolux-rs"
version = "0.1.0"
description = "Kolux RS: run many AI coding agents side by side"
authors = ["Txais Xiong"]
license-file = "../LICENSE"
publish = false
edition = "2021"
default-run = "kolux-rs"

[lib]
name = "kolux_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kolux-dev"
path = "src/bin/kolux-dev.rs"

# CLI-006: the shipped command line. Only the release script builds it, so a development build
# never puts a `kolux` on its panes' search path that would stand in for the installed one.
[[bin]]
name = "kolux"
path = "src/bin/kolux.rs"
required-features = ["release-cli"]

[features]
release-cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Codex keeps its trust in config.toml; edits must leave the rest of the file byte for byte.
toml_edit = "0.25"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-dialog = "2"
# USAGE-009: usage alerts are system notifications, sent from the Rust side.
tauri-plugin-notification = "2"
# AUTO-001: timetables are worked out in the IANA zone saved with an automation (already in the tree via tauri).
jiff = "0.2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
trash = "5"
# Already in the build through the updater; fetches CDN scripts for offline artifacts (SKILL-035).
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
unicode_names2 = "4.0.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
