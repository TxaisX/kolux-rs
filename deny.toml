# cargo-deny policy. LOOP.md section 0: only these licenses may enter the Rust dependency tree.
# Run from src-tauri: ../.tools/bin/cargo-deny check   (all four checks; CI runs the same, T-541)

[licenses]
# Our own crate is proprietary (see LICENSE) and never published; the policy is for dependencies.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[advisories]
# Every RustSec advisory fails the check (vulnerable, unmaintained, unsound, yanked) except the
# entries below. Each names why it cannot be fixed here and when it was recorded; drop it the day an
# upgrade exists. A new entry needs its own line in the commit body saying why.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained (not a vulnerability); it comes in only through tauri -> gtk 0.18 -> glib-macros, the Linux GTK stack, and the advisory lists no safe upgrade. Recorded 2026-10-13 by T-541." },
  { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 comes in only through tauri-plugin-updater 2.13.3 (latest 2.x; zip >= 9 is not reachable without the 3.0 alpha). The advisory concerns Unix extraction (SUID/SGID bits, symlink targets; verified on macOS and Linux), and the updater only unpacks bundles it has downloaded from Kolux own endpoint and signature-verified first. Recorded 2026-10-28 by T-581; drop when tauri-plugin-updater takes zip >= 9." },
  { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 comes in only through tauri-plugin-updater 2.13.3 (latest 2.x; zip >= 9 is not reachable without the 3.0 alpha). The advisory concerns Unix extraction (SUID/SGID bits, symlink targets; verified on macOS and Linux), and the updater only unpacks bundles it has downloaded from Kolux own endpoint and signature-verified first. Recorded 2026-10-28 by T-581; drop when tauri-plugin-updater takes zip >= 9." },
  { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 comes in only through tauri-plugin-updater 2.13.3 (latest 2.x; zip >= 9 is not reachable without the 3.0 alpha). The advisory concerns Unix extraction (SUID/SGID bits, symlink targets; verified on macOS and Linux), and the updater only unpacks bundles it has downloaded from Kolux own endpoint and signature-verified first. Recorded 2026-10-28 by T-581; drop when tauri-plugin-updater takes zip >= 9." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (not a vulnerability; merged into zbus 6). Linux-only D-Bus path (tauri-plugin-notification -> notify-rust -> zbus 5), not built into the Windows app; zbus 6 is not reachable because notify-rust 4.18.2 pins zbus 5. Revisit when tauri moves off zbus. Recorded 2026-10-28 by T-581." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (not a vulnerability; merged into zbus 6). Linux-only D-Bus path (tauri-plugin-notification -> notify-rust -> zbus 5), not built into the Windows app; zbus 6 is not reachable because notify-rust 4.18.2 pins zbus 5. Revisit when tauri moves off zbus. Recorded 2026-10-28 by T-581." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (not a vulnerability; merged into zbus 6). Linux-only D-Bus path (tauri-plugin-notification -> notify-rust -> zbus 5), not built into the Windows app; zbus 6 is not reachable because notify-rust 4.18.2 pins zbus 5. Revisit when tauri moves off zbus. Recorded 2026-10-28 by T-581." },
]

[bans]
# Two versions of one crate are reported, not failed: they come from the tauri dependency tree.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Crates come from crates.io only; a git or other-registry dependency fails the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
