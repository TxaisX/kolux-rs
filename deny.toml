# cargo-deny policy. LOOP.md section 0: only these licenses may enter the Rust dependency tree.
# Run: .tools/bin/cargo-deny check licenses   (CI runs the same)

[licenses]
# Our own crate is proprietary (see LICENSE) and never published; the policy is for dependencies.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8
