# APP-060: CI. The front-end suite runs in four shards on Linux (1x minutes), and the
# Windows-only work (Rust, PTY, the installer) runs on windows-latest. The installer is
# built on demand or on a tag, not on every push, because a release build costs more
# minutes than the rest of the pipeline together.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request run is wasted minutes; a main run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id stays `test` because scripts/workflow-check.mjs guards the four-shard
  # promise (APP-060) against it. Only the runner changed: Linux bills at 1x.
  test:
    name: Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Front-end tests
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  checks:
    name: Types, licences, plan and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc
      - run: node scripts/license-check.mjs
      - run: node scripts/plan-check.mjs
      - run: node scripts/workflow-check.mjs

  rust:
    name: Rust tests, lints and dependencies
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: pnpm install --frozen-lockfile
      - name: Rust tests
        working-directory: src-tauri
        shell: pwsh
        # The integration tests only run under scratch homes (tests/scratch_root), as in the local gate.
        run: |
          . ../scripts/test-env.ps1
          cargo test
      - name: Rust lints
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Dependency check
        working-directory: src-tauri
        run: cargo deny check
      - name: Spec firewall
        shell: pwsh
        run: ./scripts/firewall-check.ps1 -Baseline

  # Not on every push: a cold Tauri release build is the most expensive job here.
  # Run it by hand, or by pushing a v* tag when a release is actually being made.
  bundle:
    name: Installer (on demand)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build the installer
        run: pnpm exec tauri build --bundles nsis
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: kolux-rs-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  result:
    name: CI result
    needs: [test, checks, rust, bundle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.checks.result }}" != "success" ] || [ "${{ needs.rust.result }}" != "success" ]; then
            echo "A required job did not pass: test=${{ needs.test.result }}, checks=${{ needs.checks.result }}, rust=${{ needs.rust.result }}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ needs.bundle.result }}" = "failure" ] || [ "${{ needs.bundle.result }}" = "cancelled" ]; then
            echo "The installer job did not pass: ${{ needs.bundle.result }}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required jobs passed (installer: ${{ needs.bundle.result }})." >> "$GITHUB_STEP_SUMMARY"
