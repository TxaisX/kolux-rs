<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- OpenAI's hexagonal knot, redrawn by hand as six interlocking rounded links. Draws in the current text colour. -->
  <g stroke="currentColor" stroke-width="1.3" fill="none">
    <rect x="5.4" y="1.2" width="5.2" height="9.4" rx="2.6" transform="rotate(0 8 8)"/>
    <rect x="5.4" y="1.2" width="5.2" height="9.4" rx="2.6" transform="rotate(60 8 8)"/>
    <rect x="5.4" y="1.2" width="5.2" height="9.4" rx="2.6" transform="rotate(120 8 8)"/>
    <rect x="5.4" y="1.2" width="5.2" height="9.4" rx="2.6" transform="rotate(180 8 8)"/>
    <rect x="5.4" y="1.2" width="5.2" height="9.4" rx="2.6" transform="rotate(240 8 8)"/>
    <rect x="5.4" y="1.2" width="5.2" height="9.4" rx="2.6" transform="rotate(300 8 8)"/>
  </g>
</svg>
